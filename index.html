<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Lector de Documentos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <style>
    body{font-family:sans-serif;max-width:600px;margin:auto;text-align:center}
    textarea{width:100%;height:220px;margin-top:10px}
    input[type=file]{margin-top:10px}
  </style>
</head>
<body>
<h1>Lector Web</h1>

<input type="file" id="file" accept=".txt">
<br><br>

<label>Velocidad: <span id="val">1.0</span>x</label><br>
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
<br><br>

<button id="play">▶ Leer</button>
<button id="pause">⏸ Pausa</button>
<button id="stop">■ Detener</button>

<textarea id="box" readonly></textarea>

<script src="app.js"></script>
</body>
</html>
